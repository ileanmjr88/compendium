version: 2

project_name: compendium

before:
  hooks:
    - go mod tidy

builds:
  - id: compendium
    main: ./cmd/compendium
    binary: compendium
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/ileanmjr88/compendium/internal/buildinfo.Version={{.Version}}
      - -X github.com/ileanmjr88/compendium/internal/buildinfo.Commit={{.ShortCommit}}

archives:
  - id: compendium
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
