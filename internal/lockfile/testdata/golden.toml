# Golden reference lockfile for the wordNebula project.
# Canonical example exercising every part of the compendium.lock schema
# (see internal/lockfile/lockfile.go). Hand-authored oracle: the lockfile
# writer's output for wordNebula is compared against this file.

[meta]
schema = 1                       # lockfile schema version (lockfile.CurrentSchema)
project = "wordNebula"
compendium_version = "0.1.1"     # compendium binary that produced the lock
# Union of every locked item's available platforms. Individual items may cover
# fewer (e.g. clang below has no darwin-amd64 build).
platforms = ["linux-amd64", "linux-arm64", "darwin-amd64", "darwin-arm64"]

[meta.registry]
source = "public"
index_version = "2"              # registry index.json "version" at lock time

# spec = the request string from compendium.toml (e.g. "clang@22.1.2");
# version = the resolved version; source = where it came from (registry).
# clang 22.1.2 ships only 3 platforms: LLVM publishes no darwin-amd64
# (Intel macOS) build, so this item is missing from the union above.
[[language]]
name = "cpp"
version = "22.1.2"
spec = "clang@22.1.2"
source = "registry"

[[language.artifacts]]
platform = "linux"
arch = "amd64"
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.2/LLVM-22.1.2-Linux-X64.tar.xz"
checksum = "sha256:ff32497b6801267ee427bc69cdaeecfb2d19578af8c2a942e864c45215f9a2ac"
size = 1939541864
strip = 1                        # tar strip-components applied on extract

[[language.artifacts]]
platform = "linux"
arch = "arm64"
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.2/LLVM-22.1.2-Linux-ARM64.tar.xz"
checksum = "sha256:cf2e84d965a95954971cafc71d18c0eb38e723c3ac7276286fd5636df4374b3a"
size = 1770442424
